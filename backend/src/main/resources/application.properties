spring.application.name=partepro

# En local se carga ../.env si existe (ejecutando desde backend/); en Docker y CI llegan como variables de entorno.
spring.config.import=optional:file:../.env[.properties]

# Conexión: la clave no tiene valor por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/partepro}
spring.datasource.username=${DB_USER:partepro}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo gestiona Flyway; Hibernate solo comprueba que coincide con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
